<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rig Veda Mandala Explorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
  body {
    margin: 0;
    font-family: 'Roboto', sans-serif;
    background: #f8f9fa;
    color: #333;
  }
  header {
    text-align: center;
    padding: 2rem 1rem 1rem;
    background: #4a90e2;
    color: white;
  }
  header h1 {
    margin: 0;
    font-weight: 700;
    font-size: 2.5rem;
    letter-spacing: 1.5px;
  }
  #mandala-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(100px,1fr));
    gap: 1rem;
    padding: 1rem;
    max-width: 960px;
    margin: 0 auto;
  }
  .mandala-card {
    background: white;
    border-radius: 10px;
    padding: 1.2rem 0;
    text-align: center;
    font-weight: 700;
    font-size: 1.2rem;
    color: #4a90e2;
    box-shadow: 0 4px 8px rgba(74,144,226,0.15);
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    user-select: none;
  }
  .mandala-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 20px rgba(74,144,226,0.3);
  }
  #search-bar {
    max-width: 600px;
    margin: 1rem auto 2rem;
    display: flex;
    gap: 0.75rem;
    padding: 0 1rem;
  }
  #search-input {
    flex: 1;
    padding: 0.6rem 1rem;
    border: 2px solid #4a90e2;
    border-radius: 30px;
    font-size: 1rem;
    transition: box-shadow 0.3s ease;
  }
  #search-input:focus {
    outline: none;
    box-shadow: 0 0 10px #4a90e2;
  }
  #search-button {
    background: #4a90e2;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 0 1.5rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  #search-button:hover {
    background: #2f67c0;
  }
  main {
    max-width: 900px;
    margin: 0 auto 3rem;
    padding: 0 1rem;
  }
  #mandala-title {
    font-size: 2rem;
    font-weight: 700;
    color: #4a90e2;
    margin-bottom: 1rem;
    text-align: center;
  }
  .sukta {
    background: white;
    margin-bottom: 1rem;
    border-radius: 12px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.08);
    overflow: hidden;
    transition: max-height 0.4s ease;
  }
  .sukta-header {
    padding: 1rem 1.5rem;
    font-weight: 700;
    font-size: 1.25rem;
    cursor: pointer;
    user-select: none;
    background: #e6f2ff;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sukta-verse-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }
  .sukta-verse-list.open {
    max-height: 600px;
  }
  .verse {
    padding: 0.75rem 1.5rem;
    border-top: 1px solid #ddd;
    font-size: 1rem;
    line-height: 1.4;
  }
  .verse em {
    display: block;
    margin-top: 0.3rem;
    color: #777;
    font-style: normal;
    font-size: 0.85rem;
  }
  #search-results {
    max-width: 900px;
    margin: 1rem auto 3rem;
    padding: 1rem;
    background: #ffffffcc;
    border-radius: 10px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.12);
    max-height: 300px;
    overflow-y: auto;
    font-size: 0.95rem;
  }
  .search-result-item {
    margin-bottom: 1rem;
  }
  .search-result-item strong {
    color: #4a90e2;
  }
  footer {
    text-align: center;
    padding: 1rem;
    font-size: 0.85rem;
    color: #555;
    border-top: 1px solid #ddd;
    background: #f0f2f5;
  }
  a {
    color: #4a90e2;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .mandala-card {
      font-size: 1rem;
      padding: 1rem 0;
    }
  }

  /* Fade-in animation */
  .fade-in {
    animation: fadeInUp 0.5s ease forwards;
    opacity: 0;
  }
  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(10px);
    } to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Arrow icon for accordion */
  .arrow {
    border: solid #4a90e2;
    border-width: 0 3px 3px 0;
    display: inline-block;
    padding: 5px;
    transition: transform 0.4s ease;
    margin-left: 10px;
  }
  .down {
    transform: rotate(45deg);
  }
  .right {
    transform: rotate(-45deg);
  }
</style>
</head>
<body>

<header>
  <h1>Rig Veda Mandala Explorer</h1>
</header>

<section id="search-bar">
  <input type="text" id="search-input" placeholder="Search hymns, verses, or deities..." />
  <button id="search-button">Search</button>
</section>

<section id="mandala-grid" aria-label="Select a Mandala to explore">
  <!-- Filled by JS -->
</section>

<main>
  <h2 id="mandala-title"></h2>
  <div id="mandala-details" aria-live="polite">
    <!-- Mandala details go here -->
  </div>
</main>

<section id="search-results" aria-live="polite" hidden>
  <!-- Search results go here -->
</section>

<footer>
  All Rig Veda Samhita content sourced from
  <a href="https://vedicheritage.gov.in/samhitas/rigveda/" target="_blank" rel="noopener noreferrer">
    vedicheritage.gov.in
  </a>.
</footer>

<script>
  // Sample data for Mandalas 1-3 (Include all Mandalas 1–10 for full site)
  const rigvedaData = [
    {
      mandala: 1,
      suktas: [
        {
          number: 1,
          title: "Agni Sukta",
          verses: [
            { number: 1, text: "Agni, be kindled here, worthy to be praised.", deities: ["Agni"] },
            { number: 2, text: "Agni, protector of all life and sacrifice.", deities: ["Agni"] }
          ]
        },
        {
          number: 2,
          title: "Bhṛgu Sukta",
          verses: [
            { number: 1, text: "We invoke the Sage Bhrigu...", deities: ["Bhrigu"] }
          ]
        }
      ]
    },
    {
      mandala: 2,
      suktas: [
        {
          number: 1,
          title: "Dyaus Sukta",
          verses: [
            { number: 1, text: "Heaven and Earth sustain us.", deities: ["Dyaus"] }
          ]
        }
      ]
    },
    {
      mandala: 3,
      suktas: [
        {
          number: 1,
          title: "Indra Sukta",
          verses: [
            { number: 1, text: "Hail to Indra, the king of gods!", deities: ["Indra"] },
            { number: 2, text: "Indra, wielder of the thunderbolt and the earth-shaker.", deities: ["Indra"] }
          ]
        }
      ]
    }
  ];

  const mandalaGrid = document.getElementById('mandala-grid');
  const mandalaTitle = document.getElementById('mandala-title');
  const mandalaDetails = document.getElementById('mandala-details');
  const searchInput = document.getElementById('search-input');
  const searchButton = document.getElementById('search-button');
  const searchResultsSection = document.getElementById('search-results');

  // Build Mandala selection grid
  rigvedaData.forEach(mandala => {
    const card = document.createElement('div');
    card.textContent = `Mandala ${mandala.mandala}`;
    card.className = 'mandala-card fade-in';
    card.style.animationDelay = (mandala.mandala * 0.1) + 's';
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-pressed', 'false');
    card.addEventListener('click', () => selectMandala(mandala.mandala));
    card.addEventListener('keypress', e => {
      if(e.key === 'Enter' || e.key === ' ') {
        selectMandala(mandala.mandala);
      }
    });
    mandalaGrid.appendChild(card);
  });

  let currentOpenSukta = null;

  function selectMandala(num) {
    const mandala = rigvedaData.find(m => m.mandala === num);
    if (!mandala) return;

    searchResultsSection.hidden = true;
    mandalaTitle.textContent = `Mandala ${mandala.mandala}`;
    mandalaDetails.innerHTML = '';

    mandala.suktas.forEach(sukta => {
      const suktaDiv = document.createElement('div');
      suktaDiv.className = 'sukta';

      const header = document.createElement('div');
      header.className = 'sukta-header';
      header.textContent = `Sukta ${sukta.number}: ${sukta.title}`;

      // arrow icon
      const arrow = document.createElement('i');
      arrow.className = 'arrow right';
      header.appendChild(arrow);

      header.addEventListener('click', () => {
        const list = suktaDiv.querySelector('.sukta-verse-list');
        if (list.classList.contains('open')) {
          list.classList.remove('open');
          arrow.classList.replace('down', 'right');
          currentOpenSukta = null;
        } else {
          // close previous open
          if (currentOpenSukta && currentOpenSukta !== list) {
            currentOpenSukta.classList.remove('open');
            const prevArrow = currentOpenSukta.parentNode.querySelector('.arrow');
            prevArrow.classList.replace('down', 'right');
          }
          list.classList.add('open');
          arrow.classList.replace('right', 'down');
          currentOpenSukta = list;
        }
      });

      suktaDiv.appendChild(header);

      const versesList = document.createElement('ol');
      versesList.className = 'sukta-verse-list';
      sukta.verses.forEach(verse => {
        const verseLi = document.createElement('li');
        verseLi.className = 'verse';
        verseLi.innerHTML = `${verse.text} <em>Deities: ${verse.deities.join(', ')}</em>`;
        versesList.appendChild(verseLi);
      });

      suktaDiv.appendChild(versesList);

      mandalaDetails.appendChild(suktaDiv);
    });
  }

  function searchVerses(query) {
    if (!query.trim()) return [];

    const q = query.toLowerCase();
    const results = [];

    rigvedaData.forEach(mandala => {
      mandala.suktas.forEach(sukta => {
        sukta.verses.forEach(verse => {
          if (
            verse.text.toLowerCase().includes(q) ||
            verse.deities.some(d => d.toLowerCase().includes(q))
          ) {
            results.push({
              mandala: mandala.mandala,
              sukta: sukta.number,
              verse: verse.number,
              text: verse.text,
              deities: verse.deities
            });
          }
        });
      });
    });
    return results;
  }

  searchButton.addEventListener('click', () => {
    const query = searchInput.value;
    const results = searchVerses(query);

    if (!results.length) {
      searchResultsSection.hidden = true;
      alert('No results found for: ' + query);
      return;
    }

    searchResultsSection.innerHTML = `<h3>Search Results (${results.length})</h3>` + 
      results.map(res => `
        <div class="search-result-item">
          <strong>Mandala ${res.mandala}, Sukta ${res.sukta}, Verse ${res.verse}</strong><br/>
          ${res.text}<br/>
          <em>Deities: ${res.deities.join(', ')}</em>
        </div>
      `).join('');
    searchResultsSection.hidden = false;

    // Scroll to search results smoothly
    searchResultsSection.scrollIntoView({ behavior: 'smooth' });
  });

</script>

</body>
</html>
